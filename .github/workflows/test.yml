name: test
on:
  pull_request:
  push:
    branches:
    - master

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Run unit tests
      run: go test -race ./...
