name: test
on:
  pull_request:
  push:
    branches:
    - master

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Check formatting
      run: test -z "$(gofmt -l . | tee /dev/stderr)"
    - name: Vet
      run: go vet ./...
    - name: Run unit tests
      run: go test -race ./...

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Vet for ${{ matrix.goos }}
      run: go vet ./...
      env:
        GOOS: ${{ matrix.goos }}
